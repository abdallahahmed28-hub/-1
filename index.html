<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زاوية الشيخ سيديا الكبير - القرآن الكريم</title>
    
    <!-- أيقونة الموقع مدمجة مباشرة في الكود بدون ملفات خارجية -->

    <link rel="apple-touch-icon" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23012d1b'/%3E%3Crect x='20' y='20' width='472' height='472' rx='92' fill='none' stroke='%23D4AF37' stroke-width='12'/%3E%3Crect x='40' y='40' width='432' height='432' rx='72' fill='none' stroke='%23D4AF37' stroke-width='4' stroke-dasharray='10 10'/%3E%3Ctext x='256' y='230' font-family='Arial, serif' font-size='65' fill='%23D4AF37' text-anchor='middle' font-weight='bold'%3Eزاوية%3C/text%3E%3Ctext x='256' y='310' font-family='Arial, serif' font-size='45' fill='%23D4AF37' text-anchor='middle'%3Eالشيخ سيديا الكبير%3C/text%3E%3Cpath d='M 256 370 L 276 400 L 236 400 Z' fill='%23D4AF37'/%3E%3Cpath d='M 256 120 L 276 150 L 236 150 Z' fill='%23D4AF37' transform='rotate(180 256 135)'/%3E%3C/svg%3E">
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-green: #012d1b;
            --light-bg: #fdfbf7;
            --text-color: #333;
            --card-bg: #ffffff;
            --border-color: #eeeeee;
            --ayah-color: #222222;
        }
        body.dark-mode {
            --primary-gold: #e6c55c;
            --dark-green: #0d0d0d;
            --light-bg: #121212;
            --text-color: #f1f1f1;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --ayah-color: #e0e0e0;
        }
        body { margin: 0; font-family: 'Tajawal', sans-serif; background-color: var(--light-bg); color: var(--text-color); padding-bottom: 120px; transition: 0.4s; }
        header { background-color: var(--dark-green); color: white; text-align: center; padding: 30px 15px; border-bottom: 4px solid var(--primary-gold); position: relative; transition: 0.4s; }
        .site-title { font-family: 'Amiri', serif; font-size: 2.5rem; color: var(--primary-gold); margin: 0; }
        .president-name { font-size: 1rem; margin-top: 10px; color: #ecf0f1; }
        .theme-toggle-btn { position: absolute; top: 20px; left: 20px; background: transparent; border: 1px solid var(--primary-gold); color: var(--primary-gold); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-family: 'Tajawal', font-weight: bold; transition: 0.3s; }
        .theme-toggle-btn:hover { background: var(--primary-gold); color: var(--dark-green); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 15px; }
        .tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .tab-btn { background-color: var(--card-bg); color: var(--text-color); border: 2px solid var(--primary-gold); padding: 10px 25px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .tab-btn.active, .tab-btn:hover { background-color: var(--dark-green); color: var(--primary-gold); border-color: var(--dark-green); }
        .search-bar { width: 100%; max-width: 500px; padding: 12px; margin: 0 auto 30px auto; display: block; background-color: var(--card-bg); color: var(--text-color); border: 2px solid var(--primary-gold); border-radius: 8px; font-size: 1.1rem; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .surah-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); overflow: hidden; text-align: center; border: 1px solid var(--border-color); transition: 0.3s; display: flex; flex-direction: column; }
        .reciter-img { width: 100%; height: 200px; object-fit: cover; border-bottom: 3px solid var(--primary-gold); }
        .card-content { padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .play-btn { background-color: var(--dark-green); color: var(--primary-gold); border: 1px solid var(--primary-gold); padding: 10px; border-radius: 8px; cursor: pointer; flex: 2; font-weight: bold; transition: 0.3s; }
        .share-btn { background-color: #25D366; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold; transition: 0.3s; font-family: 'Tajawal'; }
        .share-btn:hover { background-color: #128C7E; }
        
        .surah-card { background: var(--card-bg); border: 1px solid var(--primary-gold); padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--text-color); transition: 0.3s; }
        .surah-card:hover { background-color: var(--primary-gold); color: var(--dark-green); }
        .last-read-banner { background-color: var(--primary-gold); color: #012d1b; padding: 15px 20px; border-radius: 8px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s; }
        .reader-container { background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: none; text-align: justify; border-top: 5px solid var(--primary-gold); transition: 0.4s; }
        .ayah-text { font-family: 'Amiri', serif; font-size: 1.8rem; line-height: 2.5; color: var(--ayah-color); }
        .ayah-number { color: var(--primary-gold); font-size: 1.2rem; margin: 0 8px; }
        
        .reader-header-actions { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: var(--dark-green); color: var(--primary-gold); border: 1px solid var(--primary-gold); padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .audio-player-container { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--dark-green); color: white; padding: 10px 0; text-align: center; border-top: 3px solid var(--primary-gold); z-index: 1000; transition: 0.4s; }
        .current-station { margin: 0 0 10px 0; font-family: 'Amiri', serif; color: var(--primary-gold); font-size: 1.2rem; }
        audio { width: 90%; max-width: 600px; outline: none; height: 40px; }
        #loading, #loading-quran { text-align: center; font-size: 1.2rem; color: var(--text-color); padding: 20px; }
    </style>
</head>
<body>

    <header>
        <button id="themeToggle" class="theme-toggle-btn" onclick="toggleTheme()">🌙 ليلي</button>
        <h1 class="site-title">زاوية الشيخ سيديا الكبير</h1>
        <p class="president-name">تحت إشراف الرئيس: الشيخ إسحاق ولد موسى ولد الشيخ سيديا</p>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('radios', this)">الإذاعات الصوتية</button>
            <button class="tab-btn" onclick="switchTab('quran', this)">المصحف المكتوب</button>
        </div>

        <div id="radios-tab">
            <input type="text" id="searchInput" class="search-bar" placeholder="ابحث عن اسم القارئ أو الإذاعة...">
            <div id="loading">جاري تحميل الإذاعات...</div>
            <div class="grid" id="radio-grid"></div>
        </div>

        <div id="quran-tab" style="display: none;">
            <div id="last-read-banner" class="last-read-banner" style="display: none;" onclick="loadSavedSurah()">
                <span>📖 متابعة القراءة: <span id="last-surah-name"></span></span>
                <span>استئناف ◀</span>
            </div>
            <div id="surah-list-container">
                <div id="loading-quran">جاري تحميل الفهرس...</div>
                <div class="surah-grid" id="surah-grid"></div>
            </div>
            <div class="reader-container" id="reader-container">
                <div class="reader-header-actions">
                    <button class="back-btn" onclick="backToFihris()">العودة للفهرس</button>
                    <button class="share-btn" style="flex:0; padding:10px 20px;" onclick="shareSurah()">مشاركة 📲</button>
                </div>
                <h2 id="surah-title" style="text-align: center; font-family: 'Amiri'; color: var(--primary-gold);"></h2>
                <div id="surah-content" style="text-align: center;"></div>
            </div>
        </div>
    </div>

    <div class="audio-player-container">
        <p class="current-station" id="currentStationName">اختر إذاعة للبدء</p>
        <audio id="mainAudio" controls preload="none">
            <source src="" type="audio/mpeg">
        </audio>
    </div>

    <script>
        // Theme Logic
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeToggle').innerHTML = isDark ? '☀️ نهاري' : '🌙 ليلي';
        }
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggle').innerHTML = '☀️ نهاري';
            }
        });

        // Tabs & Last Read Logic
        let quranLoaded = false; 
        function switchTab(tabId, btnElement) {
            document.getElementById('radios-tab').style.display = tabId === 'radios' ? 'block' : 'none';
            document.getElementById('quran-tab').style.display = tabId === 'quran' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            if (tabId === 'quran') {
                checkLastRead();
                if (!quranLoaded) fetchSurahList();
            }
        }
        function checkLastRead() {
            const savedNum = localStorage.getItem('lastSurahNum');
            const savedName = localStorage.getItem('lastSurahName');
            if (savedNum && savedName) {
                document.getElementById('last-surah-name').innerText = "سُورَة " + savedName.replace('سُورَةُ ', '');
                document.getElementById('last-read-banner').style.display = 'flex';
            }
        }
        function loadSavedSurah() {
            const savedNum = localStorage.getItem('lastSurahNum');
            const savedName = localStorage.getItem('lastSurahName');
            if (savedNum && savedName) loadSurahContent(savedNum, savedName);
        }

        // Quran Logic
        async function fetchSurahList() {
            try {
                const response = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await response.json();
                const grid = document.getElementById('surah-grid');
                document.getElementById('loading-quran').style.display = 'none';
                data.data.forEach(surah => {
                    const div = document.createElement('div');
                    div.className = 'surah-card';
                    div.innerText = surah.name;
                    div.onclick = () => loadSurahContent(surah.number, surah.name);
                    grid.appendChild(div);
                });
                quranLoaded = true;
            } catch (error) { document.getElementById('loading-quran').innerText = "خطأ في تحميل المصحف."; }
        }
        async function loadSurahContent(surahNumber, surahName) {
            localStorage.setItem('lastSurahNum', surahNumber);
            localStorage.setItem('lastSurahName', surahName);
            checkLastRead();
            document.getElementById('last-read-banner').style.display = 'none';
            document.getElementById('surah-list-container').style.display = 'none';
            document.getElementById('reader-container').style.display = 'block';
            document.getElementById('surah-title').innerText = "سُورَة " + surahName.replace('سُورَةُ ', '');
            document.getElementById('surah-content').innerHTML = "<h3 style='color:var(--primary-gold);'>جاري تحميل الآيات...</h3>";
            try {
                const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/quran-uthmani`);
                const data = await response.json();
                let htmlContent = "";
                data.data.ayahs.forEach(ayah => {
                    let text = ayah.text;
                    if(surahNumber !== 1 && surahNumber !== 9 && ayah.numberInSurah === 1) {
                        text = text.replace('بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ', '');
                        htmlContent = `<div style="font-family:'Amiri'; font-size:1.5rem; color:var(--primary-gold); margin-bottom:20px;">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
                    }
                    htmlContent += `<span class="ayah-text">${text}</span> <span class="ayah-number">﴿${ayah.numberInSurah}﴾</span> `;
                });
                document.getElementById('surah-content').innerHTML = htmlContent;
            } catch (error) { document.getElementById('surah-content').innerHTML = "خطأ في جلب الآيات."; }
        }
        function backToFihris() {
            document.getElementById('reader-container').style.display = 'none';
            document.getElementById('surah-list-container').style.display = 'block';
            checkLastRead();
        }

        // Radios Logic
        const defaultImage = "https://images.unsplash.com/photo-1609599006353-e629aaabfeae?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80";
        let allRadios = [];
        async function fetchRadios() {
            try {
                const response = await fetch('https://mp3quran.net/api/v3/radios?language=ar');
                const data = await response.json();
                allRadios = data.radios;
                document.getElementById('loading').style.display = 'none';
                displayRadios(allRadios);
            } catch (error) { document.getElementById('loading').innerText = "خطأ في تحميل الإذاعات."; }
        }
        function displayRadios(radios) {
            const grid = document.getElementById('radio-grid');
            grid.innerHTML = '';
            radios.forEach(radio => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${defaultImage}" alt="${radio.name}" class="reciter-img" loading="lazy">
                    <div class="card-content">
                        <h3 style="font-family:'Amiri'; margin:0 0 10px 0; color:var(--text-color);">${radio.name}</h3>
                        <div class="action-buttons">
                            <button class="play-btn" onclick="playRadio('${radio.url}', '${radio.name}')">▶ استمع</button>
                            <button class="share-btn" onclick="shareRadio('${radio.name}')">📲 شارك</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        function playRadio(url, name) {
            const audioPlayer = document.getElementById('mainAudio');
            document.getElementById('currentStationName').innerText = name;
            audioPlayer.src = url;
            audioPlayer.play();
        }
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filteredRadios = allRadios.filter(radio => radio.name.toLowerCase().includes(searchTerm));
            displayRadios(filteredRadios);
        });

        // WhatsApp Share Functions
        function shareRadio(name) {
            const siteUrl = window.location.href.split('#')[0];
            const text = `🎧 استمع الآن لإذاعة ${name} عبر موقع زاوية الشيخ سيديا الكبير:\n${siteUrl}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }
        function shareSurah() {
            const surahName = localStorage.getItem('lastSurahName');
            const siteUrl = window.location.href.split('#')[0];
            const text = `📖 اقرأ ${surahName} بالرسم العثماني عبر موقع زاوية الشيخ سيديا الكبير:\n${siteUrl}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        window.onload = fetchRadios;
    </script>
</body>
</html>
